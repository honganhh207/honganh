const VIDEOS = [
 { ten:"Giải thích bộ nhớ RAM | Bộ nhớ RAM là gì ?", url:"https://www.youtube.com/watch?v=WIu7pDajon0&list=PLnRl-W3gZI7-8C32homKclwgG88p_Hyfy", baiHoc:2 },
 { ten:"Bộ nhớ đệm là gì? | Bộ nhớ Cache hoạt động như thế nào?", url:"https://www.youtube.com/watch?v=mmN8BQq3SJY&list=PLnRl-W3gZI7-8C32homKclwgG88p_Hyfy&index=2", baiHoc:2 },
 { ten:"Tên miền là gì? | Domain là gì? | DNS Server là gì?", url:"https://www.youtube.com/watch?v=FBF-xXX7nVM&list=PLnRl-W3gZI7-8C32homKclwgG88p_Hyfy&index=3", baiHoc:5 },
 { ten:"Giải thích về máy chủ | Máy chủ là gì? | Server là gì? | Web Server là gì?", url:"https://www.youtube.com/watch?v=R62fkqxz0b0&list=PLnRl-W3gZI7-8C32homKclwgG88p_Hyfy&index=4", baiHoc:5 }
];


/* ===== MÃ NGUỒN ===== */
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
LESSONS[0].images.push(...ANH_CHUNG);
const META={
1:['CMCN 4.0 & Chuyển đổi số','Tổng quan về CMCN 4.0, CNTT 4.0 và Chuyển đổi số','Slide_1 – Tổng quan về CMCN 4.0, CNTT 4.0, CĐS.pptx'],
2:['Kiến trúc & Phần cứng','Kiến trúc và phần cứng máy tính','Slide_2 – Computer Hardware.pptx'],
3:['Hệ điều hành & Đa nền tảng','Hệ điều hành và môi trường số đa nền tảng','Slide_3 – Operating System.pptx'],
4:['Phần mềm, Đám mây, Nền tảng','Phần mềm, đám mây, nền tảng','Slide_4 – Software, Cloud, Platform.pptx'],
5:['Mạng máy tính, Internet & IoT','Mạng máy tính, Internet và IoT','Slide_5 – Network, Internet, IoT.pptx'],
6:['Tư duy lập trình & Tự động hóa','Tư duy lập trình và tự động hóa','Slide_6 – Computational thinking, IT Automation.pptx'],
7:['AI & Dữ liệu trong học tập','AI và dữ liệu trong học tập, công việc','Slide_7 – AI, Data in studying, working.pptx'],
8:['An toàn thông tin & Đạo đức số','An toàn thông tin và Đạo đức số','Slide_8 – An toàn thông tin và Đạo đức số.pptx']};
const TYPE={pdf:'PDF',word:'Word',pptx:'PowerPoint',khac:'Tài liệu khác'};
const ytId=u=>{const m=String(u).match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?m[1]:null};
const vids=id=>VIDEOS.filter(v=>v.baiHoc===id);
const note=l=>{try{const s=localStorage.getItem('cntt40_note_'+l.id);return s!==null?s:l.note}catch(e){return l.note}};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)};
const E=t=>`<div class="empty">${t}</div>`;

/* Thông tin sinh viên (sửa được trên web) */
const IK='cntt40_info',F=['ten','mssv','lop','mon','ngay'];
let info={ten:THONG_TIN.hoTen,mssv:THONG_TIN.mssv,lop:THONG_TIN.lop,mon:'CNTT 4.0',ngay:'19/11/2026'};
try{Object.assign(info,JSON.parse(localStorage.getItem(IK)||'{}'))}catch(e){}
function renderInfo(){
  const it=[['Sinh viên',info.ten],['MSSV',info.mssv],['Lớp',info.lop],['Môn học',info.mon],['Ngày',info.ngay]];
  $('#meta').innerHTML=it.map(([k,v],i)=>(i?'<span aria-hidden="true">·</span>':'')+`<span>${k}: <strong>${esc(v)}</strong></span>`).join('');
  $('#ft').textContent=info.ten+' · '+info.mssv+' · '+info.lop;
}

/* Khối nội dung dùng chung */
const docRow=d=>{const f=esc(d.file),p=d.loai==='pdf';return `<div class="row"><div><b>${esc(d.ten)}</b><small>${TYPE[d.loai]||TYPE.khac}${d.mota?' · '+esc(d.mota):''}</small></div><div class="acts">${p?`<button type="button" class="btn" data-pdf="${f}">Xem tài liệu</button>`:''}<a class="btn ${p?'g':''}" href="${f}" download>⬇ Tải xuống</a></div></div>`};
const imgFig=i=>`<figure><img src="${esc(i.file)}" alt="${esc(i.ten)}" data-img="${esc(i.file)}" loading="lazy"><figcaption>${esc(i.ten)}</figcaption></figure>`;
const vidFig=v=>{const y=ytId(v.url);return y?`<figure><iframe class="vid" src="https://www.youtube-nocookie.com/embed/${y}" title="${esc(v.ten)}" loading="lazy" allowfullscreen></iframe><figcaption>${esc(v.ten)}<br><a class="lk" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.url)}</a></figcaption></figure>`:''};
const refRow=r=>`<div class="row"><div><b>${esc(r.ten)}</b>${r.mota?`<small>${esc(r.mota)}</small>`:''}</div><a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">Truy cập ↗</a></div>`;

/* Trang Tổng quan & Mục lục */
const FOUR=[['a) Tệp tin','File slide gốc (.pptx/.pdf) và tài liệu văn bản liên quan.'],['b) Hình ảnh / Video','Hình minh họa, sơ đồ kiến trúc, video nên xem hoặc đính kèm.'],['c) Link tham chiếu','Website uy tín, tiêu chuẩn quốc tế & văn bản luật để đọc thêm.'],['d) Ghi chú của bản thân','Tóm tắt ý chính bằng lời của mình, rút ra từ nội dung slide.']];
const TREE='📁 Thu-vien-so-ca-nhan/\n├── 📁 Bai-1/  ──▶  [📁 Tep-tin]  ·  [📁 Hinh-Video]  ·  [📁 Ghi-chu]\n├── 📁 Bai-2/  ──▶  [📁 Tep-tin]  ·  [📁 Hinh-Video]  ·  [📁 Ghi-chu]\n├── ...\n└── 📁 Bai-8/  ──▶  [📁 Tep-tin]  ·  [📁 Hinh-Video]  ·  [📁 Ghi-chu]';
function overview(list){
  const rows=list.length?list.map(l=>`<tr tabindex="0" role="link" data-go="${l.id}"><td class="w">Bài ${l.id}</td><td>${esc(META[l.id][1])}</td><td><span class="mono">${esc(META[l.id][2])}</span></td></tr>`).join(''):`<tr><td colspan="3"><div class="empty">Không tìm thấy bài học phù hợp. Hãy thử từ khóa khác.</div></td></tr>`;
  return `<div class="ch"><span class="bdg">TỔNG QUAN THƯ VIỆN</span><h2>1. Cách tổ chức thư viện &amp; 2. Mục lục 8 bài học</h2></div>
  <div class="call">Thư viện này tổng hợp toàn bộ <strong>8 bài học (8 slide)</strong> của môn học, được tổ chức theo đúng cấu trúc 4 mục để tra cứu nhanh: <strong>(a)</strong> tệp tin tài liệu, <strong>(b)</strong> hình ảnh/video, <strong>(c)</strong> link tham chiếu website khác, và <strong>(d)</strong> ghi chú của bản thân.</div>
  <div class="four">${FOUR.map(([t,d])=>`<div class="box"><strong>${t}</strong><span>${d}</span></div>`).join('')}</div>
  <h3>Gợi ý cấu trúc lưu trữ trên máy / Google Drive</h3><pre>${esc(TREE)}</pre>
  <h3>Mục lục 8 bài học (Bấm vào từng dòng để xem chi tiết)</h3>
  <div class="tw"><table><thead><tr><th class="w">Bài</th><th>Chủ đề</th><th>Tệp slide</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* Trang chi tiết từng bài: đủ 4 mục a–d */
function lessonView(l){
  const id=l.id,vs=vids(id),p=LESSONS.find(x=>x.id===id-1),n=LESSONS.find(x=>x.id===id+1);
  const sec=(k,t,b)=>`<section class="blk"><h3><span class="k">${k}</span>${t}</h3>${b}</section>`;
  const a=l.docs.map(docRow).join('')+(l.docs.some(d=>d.loai==='pdf'||d.loai==='word')?'':E(`[Chèn tài liệu PDF hoặc Word cho Bài ${id}]. Hiện bài này mới có slide gốc.`));
  const b=(l.images.length?`<div class="media">${l.images.map(imgFig).join('')}</div>`:E(`[Chèn hình ảnh minh họa cho Bài ${id}]`))+'<h4>Video</h4>'+(vs.length?`<div class="media">${vs.map(vidFig).join('')}</div>`:E(`[Chèn video cho Bài ${id}]. Trong VIDEOS, đặt baiHoc: ${id} để video hiện ở đây.`));
  const c=l.refs.length?l.refs.map(refRow).join(''):E(`[Chèn website, bài viết hoặc nguồn học trực tuyến cho Bài ${id}]`);
  const d=`<label for="note"><b>Điều em học được</b></label><textarea id="note" placeholder="[Viết ghi chú cá nhân cho Bài ${id}: tóm tắt, khái niệm quan trọng, nhận xét, suy ngẫm...]">${esc(note(l))}</textarea><div class="acts" style="margin-top:10px"><button type="button" class="btn" id="luu">Lưu ghi chú</button><button type="button" class="btn g" id="reset">Khôi phục ghi chú ban đầu</button></div><p class="hint">Ghi chú được lưu trong trình duyệt này. Muốn thay đổi vĩnh viễn, hãy sửa trường note của bài trong mã nguồn.</p>`;
  return `<div class="ch"><span class="bdg">BÀI ${id}</span><h2>${esc(META[id][1])}</h2><p style="margin:8px 0 0;color:var(--mut)">${esc(l.moTa)}</p><ul class="tp">${l.topics.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`
   +sec('a','Tệp tin',a)+sec('b','Hình ảnh / Video',b)+sec('c','Link tham chiếu',c)+sec('d','Ghi chú của bản thân',d)
   +`<div class="pn">${p?`<button type="button" class="btn g" data-go="${p.id}">← Bài ${p.id}</button>`:'<button type="button" class="btn g" data-go="0">← Mục lục</button>'}${n?`<button type="button" class="btn g" data-go="${n.id}">Bài ${n.id} →</button>`:'<button type="button" class="btn g" data-go="0">Mục lục →</button>'}</div>`;
}

/* Điều hướng, tìm kiếm */
let cur=0,q='';
const hit=l=>!q||[l.tieuDe,l.moTa,...META[l.id],...l.topics,...l.docs.map(d=>d.ten),...l.refs.map(r=>r.ten+' '+(r.mota||'')),...vids(l.id).map(v=>v.ten),note(l),'bài '+l.id].join(' ').toLowerCase().includes(q);
function render(){
  const m=location.hash.match(/^#\/bai\/([1-8])$/);cur=m?+m[1]:0;
  const list=LESSONS.filter(hit);
  $('#nav').innerHTML=`<li><a href="#/" class="${cur===0?'on':''}"><b>0</b><span>Tổng quan &amp; Mục lục</span></a></li>`+LESSONS.filter(l=>hit(l)||l.id===cur).map(l=>`<li><a href="#/bai/${l.id}" class="${l.id===cur?'on':''}"${l.id===cur?' aria-current="page"':''}><b>Bài ${l.id}</b><span>${esc(META[l.id][0])}</span></a></li>`).join('');
  $('#kq').textContent=q?`Tìm thấy ${list.length}/${LESSONS.length} bài học`:`Hiển thị toàn bộ ${LESSONS.length} bài học`;
  $('#ct').innerHTML=cur?lessonView(LESSONS.find(x=>x.id===cur)):overview(list);
}
const go=n=>{location.hash=n?'#/bai/'+n:'#/';scrollTo(0,0)};
function show(kind,src){$('#mb').innerHTML=kind==='pdf'?`<iframe src="${src}" title="Xem tài liệu PDF"></iframe>`:`<img src="${src}" alt="Xem ảnh phóng to">`;$('#modal').classList.add('on');$('#mClose').focus()}
const dong=()=>{$('#modal').classList.remove('on');$('#mb').innerHTML=''};

document.addEventListener('click',e=>{
  const t=e.target,g=t.closest('[data-go]');
  if(g)return go(+g.dataset.go);
  if(t.closest('#editBtn')){const b=$('#editBtn'),o=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',o);$('#editBox').hidden=!o;F.forEach(k=>$('#f-'+k).value=info[k]);return}
  if(t.id==='saveInfo'){F.forEach(k=>info[k]=$('#f-'+k).value.trim()||info[k]);try{localStorage.setItem(IK,JSON.stringify(info))}catch(err){}renderInfo();$('#editBox').hidden=true;$('#editBtn').setAttribute('aria-expanded','false');toast('Đã lưu thông tin.');return}
  if(t.dataset.pdf)return show('pdf',t.dataset.pdf);
  if(t.dataset.img)return show('img',t.dataset.img);
  if(t.id==='mClose'||t.id==='modal')return dong();
  if(t.id==='luu'){try{localStorage.setItem('cntt40_note_'+cur,$('#note').value);toast('Đã lưu ghi chú.')}catch(err){toast('Không thể lưu ghi chú trên trình duyệt này.')}}
  if(t.id==='reset'){try{localStorage.removeItem('cntt40_note_'+cur)}catch(err){}$('#note').value=LESSONS.find(x=>x.id===cur).note;toast('Đã khôi phục ghi chú ban đầu.')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')dong();
  if(e.key==='Enter'&&e.target.matches('tr[data-go]'))go(+e.target.dataset.go);
});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();if(cur)location.hash='#/';else render()});
addEventListener('hashchange',render);
renderInfo();render();
</script>
</body></html>
